<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIR4 - Calendario de Apariciones Mirage de Navio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff48a0;
            --bg-dark: #0a0e27;
            --bg-darker: #050810;
            --text-light: #e0e0e0;
            --text-muted: #a0a0a0;
            --success: #4ade80;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #050810 0%, #0a0e27 50%, #1a0f2e 100%);
            color: var(--text-light);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(26, 31, 58, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(255, 72, 160, 0.3);
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 300px;
        }

        .logo-text {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 10px rgba(255, 72, 160, 0.5));
            animation: pulse 2s infinite;
        }

        .avatar-placeholder {
            font-size: 5rem;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 72, 160, 0.6);
            background: rgba(255, 72, 160, 0.1);
            animation: avatarGlow 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes avatarGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 72, 160, 0.6); }
            50% { box-shadow: 0 0 40px rgba(255, 72, 160, 0.8); }
        }

        .title {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary-color), #ff8acc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(26, 31, 58, 0.4);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 72, 160, 0.2);
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-weight: 600;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label i {
            color: var(--primary-color);
        }

        .select-input {
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid var(--primary-color);
            color: var(--text-light);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .select-input:hover {
            box-shadow: 0 0 15px rgba(255, 72, 160, 0.4);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .btn-toggle {
            background: linear-gradient(135deg, var(--primary-color), #ff8acc);
            color: #fff;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 15px rgba(255, 72, 160, 0.3);
        }

        .btn-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 72, 160, 0.6);
        }

        .btn-toggle.active {
            background: rgba(74, 222, 128, 0.2);
            border-color: var(--success);
            color: var(--success);
        }

        .btn-export {
            background: rgba(255, 72, 160, 0.1);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-export:hover {
            background: rgba(255, 72, 160, 0.2);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #ff8acc);
            color: #fff;
            border: none;
            width: 100%;
        }

        .calendar-section {
            background: rgba(26, 31, 58, 0.4);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 72, 160, 0.2);
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
        }

        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(10, 14, 39, 0.6);
            font-size: 0.9rem;
        }

        .calendar-table thead {
            background: linear-gradient(135deg, rgba(255, 72, 160, 0.2), rgba(255, 136, 204, 0.1));
            border-bottom: 2px solid var(--primary-color);
            position: sticky;
            top: 0;
        }

        .calendar-table th {
            padding: 12px 8px;
            text-align: left;
            font-weight: 700;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .calendar-table td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255, 72, 160, 0.1);
            color: var(--text-light);
        }

        .calendar-table tbody tr {
            transition: all 0.3s ease;
        }

        .calendar-table tbody tr:hover {
            background: rgba(255, 72, 160, 0.05);
        }

        .calendar-table tbody tr.defeated {
            opacity: 0.6;
        }

        .calendar-table tbody tr.defeated td {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .row-actions {
            display: flex;
            gap: 5px;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 0.75rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 72, 160, 0.2);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-small:hover {
            background: rgba(255, 72, 160, 0.4);
        }

        .btn-small.set {
            background: rgba(74, 222, 128, 0.2);
            border-color: var(--success);
            color: var(--success);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(26, 31, 58, 0.95), rgba(10, 14, 39, 0.95));
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 40px rgba(255, 72, 160, 0.5);
            position: relative;
        }

        .close-modal {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
            cursor: pointer;
        }

        .modal-content h2 {
            color: var(--primary-color);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .alarm-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .alarm-options label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: var(--text-light);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .title {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }

            .select-input {
                width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .calendar-table {
                font-size: 0.75rem;
            }

            .calendar-table th,
            .calendar-table td {
                padding: 6px 4px;
            }

            .btn-small {
                padding: 4px 6px;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo-text">🎮</div>
                <div>
                    <h1 class="title">📅 Calendario MIR4</h1>
                    <p class="subtitle">⚔️ Mirage Weekly Spawns ⚔️</p>
                </div>
            </div>
            <div class="avatar-placeholder">👩‍🦰</div>
        </header>

        <section class="controls">
            <div class="control-group">
                <label for="timezone">
                    <i class="fas fa-globe"></i> Zona Horaria:
                </label>
                <select id="timezone" class="select-input">
                    <option value="-3">SA (UTC-3)</option>
                    <option value="-4">NA (UTC-4)</option>
                    <option value="2">EU (UTC+2)</option>
                    <option value="6">INMENA (UTC+6)</option>
                    <option value="8">ASIA (UTC+8)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="language">
                    <i class="fas fa-language"></i> Idioma:
                </label>
                <select id="language" class="select-input">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>

            <button id="toggleDefeated" class="btn btn-toggle">
                <i class="fas fa-check"></i> Mostrar Derrotados
            </button>

            <button id="exportPdf" class="btn btn-export">
                <i class="fas fa-file-pdf"></i> PDF
            </button>

            <button id="exportImage" class="btn btn-export">
                <i class="fas fa-image"></i> Imagen
            </button>
        </section>

        <section class="calendar-section">
            <div class="table-wrapper">
                <table class="calendar-table" id="calendarTable">
                    <thead>
                        <tr>
                            <th>✓</th>
                            <th>Mundo</th>
                            <th>Nivel</th>
                            <th>Ubicación</th>
                            <th>Boss</th>
                            <th>Horarios</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <div id="alarmModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Configurar Alarma</h2>
            <p id="alarmBossName"></p>
            <div class="alarm-options">
                <label><input type="radio" name="alarmType" value="10" checked> 10 minutos antes</label>
                <label><input type="radio" name="alarmType" value="15"> 15 minutos antes</label>
                <label><input type="radio" name="alarmType" value="30"> 30 minutos antes</label>
                <label><input type="radio" name="alarmType" value="60"> 1 hora antes</label>
            </div>
            <button id="setAlarmBtn" class="btn btn-primary">Establecer Alarma</button>
        </div>
    </div>

    <script>
        const bossData = [
            { world: 'W1', level: '140-', location: 'Bullface Forest', boss: 'Mata', times: ['2:00', '4:00', '6:00', '8:00', '10:00', '12:00'] },
            { world: 'W1', level: '140-', location: 'Demon Bull Temple 1F', boss: 'Boltox', times: ['1:00', '3:00', '5:00', '7:00', '9:00', '11:00'] },
            { world: 'W1', level: '140-', location: 'Bullface King Fiend Sanctuary', boss: 'Bullface Fiend King', times: ['3:00', '6:00', '9:00', '12:00'] },
            { world: 'W8', level: '140-', location: 'Whitemaur Sealing Circle', boss: 'Yeo Wihuang', times: ['1:00', '5:00', '9:00'] },
            { world: 'W7', level: '141+', location: 'Taehyuls Garden', boss: 'Taehyul', times: ['1:00', '3:00', '5:00', '7:00', '9:00', '11:00'] },
            { world: 'W7', level: '141+', location: 'Demon Cult Hall', boss: 'Yiun', times: ['2:00', '5:00', '8:00', '11:00'] },
            { world: 'W4', level: '141+', location: 'Phantasia Desert', boss: 'Nefarox Obdurate Zenith', times: ['2:00', '4:00', '6:00', '8:00', '10:00', '12:00'] },
            { world: 'W4', level: '141+', location: 'Overlord Sealing Circle', boss: 'Kurilaica', times: ['3:00', '6:00', '9:00', '12:00'] },
            { world: 'W2', level: '143+', location: 'Seochon Trading Post', boss: 'Ma Wonwi', times: ['7,000-8,000 Mobs'] },
            { world: 'W2', level: '143+', location: 'Redmoon Mountain', boss: 'Juhui', times: ['2:30', '5:30', '8:30', '11:30'] },
            { world: 'W5', level: '143+', location: 'Nine Dragon Ice Field', boss: 'Illusory Dream', times: ['7,000-8,000 Mobs'] },
            { world: 'W5', level: '143+', location: 'Great Sabuk Wall', boss: 'Faluk', times: ['3:30', '6:30', '9:30', '12:30'] },
            { world: 'W5', level: '143+', location: 'Illusion Temple', boss: 'Tale Warper Fiend', times: ['1:30', '4:30', '7:30', '10:30'] },
            { world: 'W3', level: '150+', location: 'Nefariox Necropolis', boss: 'Tombeast Gyo', times: ['2:30', '8:30'] },
            { world: 'W3', level: '150+', location: 'Viperbeast Plain', boss: 'Dusk Armado Emperor', times: ['1:30', '3:30', '5:30', '7:30', '9:30', '11:30'] },
            { world: 'W3', level: '150+', location: 'Rockcut Tomb', boss: 'Boodo', times: ['3:30', '9:30'] },
            { world: 'W3', level: '150+', location: 'Rockcut Tomb', boss: 'Mara', times: ['2:30', '5:30', '8:30', '11:30'] },
            { world: 'W6', level: '150+', location: 'Bincheon Town', boss: 'Sura', times: ['4:30', '10:30'] },
            { world: 'W6', level: '150+', location: 'Bincheon Town', boss: 'Mokgang', times: ['2:30', '4:30', '6:30', '8:30', '10:30', '12:30'] },
            { world: 'W6', level: '150+', location: 'Phantom Woods', boss: 'Wuhan', times: ['5:30', '11:30'] },
            { world: 'W6', level: '150+', location: 'Bincheon Labyrinth', boss: 'Obscene Yeticlops', times: ['6:30', '12:30'] },
            { world: 'W1', level: '155+', location: 'Demoniax Mine Deep Area', boss: 'Transformed Hong Yeom', times: ['1:30', '3:30', '5:30', '7:30', '9:30', '11:30'] },
            { world: 'W1', level: '155+', location: 'Unseo Town', boss: 'Jihwa', times: ['2:30', '5:30', '8:30', '11:30'] },
            { world: 'W1', level: '155+', location: 'Seven Valleys Mountain', boss: 'Nighteyes Yaksha', times: ['3:30', '9:30'] },
            { world: 'W1', level: '155+', location: 'Seven Valleys Mountain', boss: 'Black Carapace Dusk Armado', times: ['3:30', '6:30', '9:30', '12:30'] },
            { world: 'W2', level: '155+', location: 'Roaring Flame Island', boss: 'Bulhu', times: ['4:30', '10:30'] },
            { world: 'W2', level: '155+', location: 'Nine Dragon Ice Field', boss: 'Guemugwang', times: ['5:30', '11:30'] },
            { world: 'W2', level: '155+', location: 'Underground Jail', boss: 'Do Maeongryong', times: ['6:30', '12:30'] },
            { world: 'W2', level: '155+', location: 'Underground Jail', boss: 'Molgrash', times: ['1:30', '4:30', '7:30', '10:30'] },
            { world: 'W2', level: '155+', location: 'Nine Dragon Palace', boss: 'Wi Gwangryeong', times: ['2:30', '5:30', '8:30', '11:30'] },
            { world: 'W3', level: '158+', location: 'Primal Nefariox Ruins', boss: 'Krog', times: ['1:30', '7:30'] },
            { world: 'W3', level: '158+', location: 'Frozen Gorge', boss: 'Kelis', times: ['2:30', '8:30'] },
            { world: 'W3', level: '158+', location: 'Frozen Gorge', boss: 'Talasa', times: ['2:30', '5:30', '8:30', '11:30'] },
            { world: 'W3', level: '158+', location: "Ancient One's Old Castle", boss: 'Barkas', times: ['3:30', '9:30'] },
            { world: 'W3', level: '158+', location: "Hydra's Temple", boss: 'Bargan', times: ['3:30', '6:30', '9:30', '12:30'] },
            { world: 'W3', level: '158+', location: "Hydra's Temple", boss: 'Morg', times: ['4:30', '10:30'] },
            { world: 'W3', level: '158+', location: "Hydra's Depths", boss: 'Bordo', times: ['5:30', '11:30'] }
        ];

        let currentTimezone = -3;
        let showDefeated = false;
        let defeatedBosses = new Set();
        let currentLanguage = 'es';

        const translations = {
            es: {
                checkmark: '✓',
                world: 'Mundo',
                level: 'Nivel',
                location: 'Ubicación',
                boss: 'Boss',
                times: 'Horarios',
                actions: 'Acciones',
                alarm: '🔔 Alarma',
                setAlarm: '✓ Alarma',
                configure: 'Configurar Alarma',
                before: 'minutos antes',
                set: 'Establecer Alarma'
            },
            en: {
                checkmark: '✓',
                world: 'World',
                level: 'Level',
                location: 'Location',
                boss: 'Boss',
                times: 'Times',
                actions: 'Actions',
                alarm: '🔔 Alarm',
                setAlarm: '✓ Alarm',
                configure: 'Configure Alarm',
                before: 'minutes before',
                set: 'Set Alarm'
            }
        };

        document.getElementById('timezone').addEventListener('change', (e) => {
            currentTimezone = parseInt(e.target.value);
            renderTable();
        });

        document.getElementById('language').addEventListener('change', (e) => {
            currentLanguage = e.target.value;
            renderTable();
        });

        document.getElementById('toggleDefeated').addEventListener('click', (e) => {
            showDefeated = !showDefeated;
            e.target.classList.toggle('active', showDefeated);
            renderTable();
        });

        document.getElementById('exportPdf').addEventListener('click', exportToPDF);
        document.getElementById('exportImage').addEventListener('click', exportToImage);
        document.querySelector('.close-modal').addEventListener('click', closeModal);
        document.getElementById('setAlarmBtn').addEventListener('click', setAlarm);

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const t = translations[currentLanguage];

            bossData.forEach((boss, index) => {
                const isDefeated = defeatedBosses.has(`${boss.world}-${boss.boss}`);
                if (!showDefeated && isDefeated) return;

                const row = document.createElement('tr');
                row.className = isDefeated ? 'defeated' : '';

                const times = boss.times.map(time => {
                    if (time.includes('Mobs')) return time;
                    return calculateTimezone(time);
                }).join(' / ');

                const hasAlarm = localStorage.getItem(`alarm-${boss.world}-${boss.boss}`) === 'true';
                const bossKey = `${boss.world}-${boss.boss}`;

                row.innerHTML = `
                    <td><input type="checkbox" ${isDefeated ? 'checked' : ''} onchange="toggleDefeated('${bossKey}')"></td>
                    <td><strong>${boss.world}</strong></td>
                    <td>${boss.level}</td>
                    <td>${boss.location}</td>
                    <td>${boss.boss}</td>
                    <td>${times}</td>
                    <td>
                        <div class="row-actions">
                            <button class="btn-small ${hasAlarm ? 'set' : ''}" onclick="openAlarmModal('${bossKey}', '${boss.boss}')">
                                ${hasAlarm ? '✓ Alarma' : '🔔 Alarma'}
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function calculateTimezone(time) {
            if (time.includes(':')) {
                const [hours, minutes] = time.split(':').map(Number);
                let newHours = hours + currentTimezone + 3;
                
                if (newHours >= 24) newHours -= 24;
                if (newHours < 0) newHours += 24;
                
                return `${String(newHours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            }
            return time;
        }

        function toggleDefeated(bossKey) {
            if (defeatedBosses.has(bossKey)) {
                defeatedBosses.delete(bossKey);
            } else {
                defeatedBosses.add(bossKey);
            }
            renderTable();
        }

        function openAlarmModal(bossKey, boss) {
            document.getElementById('alarmBossName').textContent = `${bossKey} - ${boss}`;
            document.getElementById('alarmModal').classList.add('active');
            document.getElementById('alarmModal').dataset.bossKey = bossKey;
        }

        function closeModal() {
            document.getElementById('alarmModal').classList.remove('active');
        }

        function setAlarm() {
            const bossKey = document.getElementById('alarmModal').dataset.bossKey;
            localStorage.setItem(`alarm-${bossKey}`, 'true');
            closeModal();
            renderTable();
            alert('¡Alarma configurada!');
        }

        function exportToPDF() {
            alert('Función de PDF disponible con html2pdf');
        }

        function exportToImage() {
            alert('Función de imagen disponible con html2canvas');
        }

        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('alarmModal')) {
                closeModal();
            }
        });

        renderTable();
    </script>
</body>
</html>
