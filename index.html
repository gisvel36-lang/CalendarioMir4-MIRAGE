<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIR4 - Calendario de Apariciones Mirage de Navio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #ff48a0;
            --bg-dark: #0a0e27;
            --bg-darker: #050810;
            --text-light: #e0e0e0;
            --text-muted: #a0a0a0;
            --success: #4ade80;
            --warning: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #050810 0%, #0a0e27 50%, #1a0f2e 100%);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(26, 31, 58, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(255, 72, 160, 0.3);
            flex-wrap: wrap;
            gap: 20px;
            position: relative;
        }

        .spam-container {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 999;
        }

        .spam-text {
            position: absolute;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            opacity: 0;
            animation: spam-blink 0.6s infinite;
            pointer-events: none;
            text-shadow: 0 0 10px currentColor;
        }

        @keyframes spam-blink {
            0%, 10%, 20%, 30%, 40%, 90%, 100% {
                opacity: 0;
            }
            15%, 25%, 35% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2) rotate(5deg);
            }
        }

        .spam-yellow { color: #ffd700; text-shadow: 0 0 20px #ffd700; }
        .spam-pink { color: #ff48a0; text-shadow: 0 0 20px #ff48a0; }
        .spam-cyan { color: #00ffff; text-shadow: 0 0 20px #00ffff; }
        .spam-lime { color: #00ff00; text-shadow: 0 0 20px #00ff00; }

        .header-content {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
            min-width: 300px;
        }

        .logo-img {
            height: 100px;
            filter: drop-shadow(0 0 15px rgba(255, 72, 160, 0.6));
        }

        .title {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary-color), #ff8acc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(26, 31, 58, 0.4);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 72, 160, 0.2);
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-weight: 600;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label i {
            color: var(--primary-color);
        }

        .select-input {
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid var(--primary-color);
            color: var(--text-light);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .select-input:hover {
            box-shadow: 0 0 15px rgba(255, 72, 160, 0.4);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .btn-toggle {
            background: linear-gradient(135deg, var(--primary-color), #ff8acc);
            color: #fff;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 15px rgba(255, 72, 160, 0.3);
        }

        .btn-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 72, 160, 0.6);
        }

        .btn-toggle.active {
            background: rgba(74, 222, 128, 0.2);
            border-color: var(--success);
            color: var(--success);
        }

        .btn-export {
            background: rgba(255, 72, 160, 0.1);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-export:hover {
            background: rgba(255, 72, 160, 0.2);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #ff8acc);
            color: #fff;
            border: none;
            width: 100%;
        }

        .calendar-section {
            background: rgba(26, 31, 58, 0.4);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 72, 160, 0.2);
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
        }

        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(10, 14, 39, 0.6);
            font-size: 0.9rem;
        }

        .calendar-table thead {
            background: linear-gradient(135deg, rgba(255, 72, 160, 0.2), rgba(255, 136, 204, 0.1));
            border-bottom: 2px solid var(--primary-color);
            position: sticky;
            top: 0;
        }

        .calendar-table th {
            padding: 12px 8px;
            text-align: left;
            font-weight: 700;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .calendar-table td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255, 72, 160, 0.1);
            color: var(--text-light);
        }

        .calendar-table tbody tr {
            transition: all 0.3s ease;
        }

        .calendar-table tbody tr:hover {
            background: rgba(255, 72, 160, 0.05);
        }

        .calendar-table tbody tr.mirage-main {
            background: rgba(255, 215, 0, 0.15);
            border-left: 4px solid var(--warning);
            animation: row-glow 2s infinite;
        }

        @keyframes row-glow {
            0%, 100% {
                background: rgba(255, 215, 0, 0.15);
                box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.3);
            }
            50% {
                background: rgba(255, 215, 0, 0.25);
                box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.5);
            }
        }

        .calendar-table tbody tr.mirage-main td {
            color: #ffd700;
            font-weight: 600;
        }

        .calendar-table tbody tr.defeated {
            opacity: 0.6;
        }

        .calendar-table tbody tr.defeated td {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .row-actions {
            display: flex;
            gap: 5px;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 0.75rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 72, 160, 0.2);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-small:hover {
            background: rgba(255, 72, 160, 0.4);
        }

        .btn-small.set {
            background: rgba(74, 222, 128, 0.2);
            border-color: var(--success);
            color: var(--success);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(26, 31, 58, 0.95), rgba(10, 14, 39, 0.95));
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 40px rgba(255, 72, 160, 0.5);
            position: relative;
        }

        .close-modal {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
            cursor: pointer;
        }

        .modal-content h2 {
            color: var(--primary-color);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .alarm-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .alarm-options label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: var(--text-light);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .header-content {
                flex-direction: column;
            }

            .title {
                font-size: 1.8rem;
            }

            .logo-img {
                height: 80px;
            }

            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }

            .select-input {
                width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .calendar-table {
                font-size: 0.75rem;
            }

            .calendar-table th,
            .calendar-table td {
                padding: 6px 4px;
            }

            .btn-small {
                padding: 4px 6px;
                font-size: 0.65rem;
            }

            .spam-text {
                font-size: 1.2rem;
            }
        }

        .print-hidden {
            display: none !important;
        }

        @media print {
            .controls, .btn-export, .spam-container {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- Spam Container -->
    <div class="spam-container" id="spamContainer"></div>

    <div class="container">
        <header class="header">
            <div class="header-content">
                <img src="https://vvrl.cc/es/i543v8/logo-mir4.png" alt="MIR4 Logo" class="logo-img">
                <div>
                    <h1 class="title">📅 Calendario MIR4</h1>
                    <p class="subtitle">⚔️ Mirage Weekly Spawns ⚔️</p>
                </div>
            </div>
        </header>

        <section class="controls">
            <div class="control-group">
                <label for="timezone">
                    <i class="fas fa-globe"></i> Zona Horaria:
                </label>
                <select id="timezone" class="select-input">
                    <option value="-3">SA (UTC-3)</option>
                    <option value="-4">NA (UTC-4)</option>
                    <option value="2">EU (UTC+2)</option>
                    <option value="6">INMENA (UTC+6)</option>
                    <option value="8">ASIA (UTC+8)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="language">
                    <i class="fas fa-language"></i> Idioma:
                </label>
                <select id="language" class="select-input">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                </select>
            </div>

            <button id="toggleDefeated" class="btn btn-toggle">
                <i class="fas fa-check"></i> Mostrar Derrotados
            </button>

            <button id="exportPdf" class="btn btn-export">
                <i class="fas fa-file-pdf"></i> Descargar PDF
            </button>

            <button id="exportImage" class="btn btn-export">
                <i class="fas fa-image"></i> Descargar Imagen
            </button>
        </section>

        <section class="calendar-section">
            <div class="table-wrapper">
                <table class="calendar-table" id="calendarTable">
                    <thead>
                        <tr>
                            <th>✓</th>
                            <th>Mundo</th>
                            <th>Nivel</th>
                            <th>Ubicación</th>
                            <th>Boss</th>
                            <th>Horarios</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <div id="alarmModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Configurar Alarma</h2>
            <p id="alarmBossName"></p>
            <div class="alarm-options">
                <label><input type="radio" name="alarmType" value="10" checked> 10 minutos antes</label>
                <label><input type="radio" name="alarmType" value="15"> 15 minutos antes</label>
                <label><input type="radio" name="alarmType" value="30"> 30 minutos antes</label>
                <label><input type="radio" name="alarmType" value="60"> 1 hora antes</label>
            </div>
            <button id="setAlarmBtn" class="btn btn-primary">Establecer Alarma</button>
        </div>
    </div>

    <script>
        // Crear spam de texto titilante
        const spamMessages = [
            '⚔️ ¡APARECIÓ! ⚔️',
            '🔥 MIRAGE DE NAVIO 🔥',
            '💰 ¡CORRE! 💰',
            '⚡ ¡DERRÓTALO! ⚡',
            '✨ ¡BOSSES! ✨',
            '🎯 ¡AHORA! 🎯',
            '💎 ¡LOOT! 💎'
        ];

        const spamColors = ['spam-yellow', 'spam-pink', 'spam-cyan', 'spam-lime'];

        function createSpam() {
            const container = document.getElementById('spamContainer');
            
            for (let i = 0; i < 8; i++) {
                const spam = document.createElement('div');
                spam.className = `spam-text ${spamColors[Math.floor(Math.random() * spamColors.length)]}`;
                spam.textContent = spamMessages[Math.floor(Math.random() * spamMessages.length)];
                
                spam.style.left = Math.random() * 80 + '%';
                spam.style.top = Math.random() * 80 + '%';
                spam.style.animationDelay = (Math.random() * 2) + 's';
                spam.style.fontSize = (Math.random() * 0.5 + 1.5) + 'rem';
                
                container.appendChild(spam);
            }
        }

        // Crear spam cada 3 segundos
        setInterval(() => {
            createSpam();
            
            // Limpiar spam viejo
            const spamTexts = document.querySelectorAll('.spam-text');
            if (spamTexts.length > 50) {
                for (let i = 0; i < 10; i++) {
                    spamTexts[i].remove();
                }
            }
        }, 3000);

        // Datos del Mirage Navio - Especiales
        const mirageNavioData = [
            { world: 'W7', level: '141+', location: '3F Desfiladero de la Lúnula de Sangre', boss: 'Mirage de Navio', times: ['22:00'] },
            { world: 'W8', level: '≤140', location: '3F Mina Abandonada', boss: 'Mirage de Navio', times: ['00:00'] },
            { world: 'W2', level: '143+', location: 'Pico del Camino Celeste', boss: 'Mirage de Navio', times: ['22:00'] },
            { world: 'W5', level: '143+', location: 'Templo Ilusorio', boss: 'Mirage de Navio', times: ['00:00'] },
            { world: 'W3', level: '150+', location: 'Túmulo de Rockut', boss: 'Mirage de Navio', times: ['22:00'] },
            { world: 'W1', level: '≤140', location: '3F Templo del Toro Demoniaco', boss: 'Mirage de Navio', times: ['22:00'] },
            { world: 'W4', level: '141+', location: '2F Paraíso de las Espadas', boss: 'Mirage de Navio', times: ['00:00'] },
            { world: 'W6', level: '150+', location: 'Laberinto de Bicheon', boss: 'Mirage de Navio', times: ['00:00'] }
        ];

        // Datos de otros jefes (Weekly Spawns)
        const otherBossData = [
            { world: 'W1', level: '140-', location: 'Bullface Forest', boss: 'Mata', times: ['2:00', '4:00', '6:00', '8:00', '10:00', '12:00'] },
            { world: 'W1', level: '140-', location: 'Demon Bull Temple 1F', boss: 'Boltox', times: ['1:00', '3:00', '5:00', '7:00', '9:00', '11:00'] },
            { world: 'W1', level: '140-', location: 'Bullface King Fiend Sanctuary', boss: 'Bullface Fiend King', times: ['3:00', '6:00', '9:00', '12:00'] },
            { world: 'W8', level: '140-', location: 'Whitemaur Sealing Circle', boss: 'Yeo Wihuang', times: ['1:00', '5:00', '9:00'] },
            { world: 'W7', level: '141+', location: 'Taehyuls Garden', boss: 'Taehyul', times: ['1:00', '3:00', '5:00', '7:00', '9:00', '11:00'] },
            { world: 'W7', level: '141+', location: 'Demon Cult Hall', boss: 'Yiun', times: ['2:00', '5:00', '8:00', '11:00'] },
            { world: 'W4', level: '141+', location: 'Phantasia Desert', boss: 'Nefarox Obdurate Zenith', times: ['2:00', '4:00', '6:00', '8:00', '10:00', '12:00'] },
            { world: 'W4', level: '141+', location: 'Overlord Sealing Circle', boss: 'Kurilaica', times: ['3:00', '6:00', '9:00', '12:00'] },
            { world: 'W2', level: '143+', location: 'Seochon Trading Post', boss: 'Ma Wonwi', times: ['7,000-8,000 Mobs'] },
            { world: 'W2', level: '143+', location: 'Redmoon Mountain', boss: 'Juhui', times: ['2:30', '5:30', '8:30', '11:30'] },
            { world: 'W5', level: '143+', location: 'Nine Dragon Ice Field', boss: 'Illusory Dream', times: ['7,000-8,000 Mobs'] },
            { world: 'W5', level: '143+', location: 'Great Sabuk Wall', boss: 'Faluk', times: ['3:30', '6:30', '9:30', '12:30'] },
            { world: 'W3', level: '150+', location: 'Nefariox Necropolis', boss: 'Tombeast Gyo', times: ['2:30', '8:30'] },
            { world: 'W3', level: '150+', location: 'Viperbeast Plain', boss: 'Dusk Armado Emperor', times: ['1:30', '3:30', '5:30', '7:30', '9:30', '11:30'] },
            { world: 'W3', level: '150+', location: 'Rockcut Tomb', boss: 'Boodo', times: ['3:30', '9:30'] },
            { world: 'W3', level: '150+', location: 'Rockcut Tomb', boss: 'Mara', times: ['2:30', '5:30', '8:30', '11:30'] },
            { world: 'W6', level: '150+', location: 'Bincheon Town', boss: 'Sura', times: ['4:30', '10:30'] },
            { world: 'W6', level: '150+', location: 'Bincheon Town', boss: 'Mokgang', times: ['2:30', '4:30', '6:30', '8:30', '10:30', '12:30'] },
            { world: 'W6', level: '150+', location: 'Phantom Woods', boss: 'Wuhan', times: ['5:30', '11:30'] },
            { world: 'W6', level: '150+', location: 'Bincheon Labyrinth', boss: 'Obscene Yeticlops', times: ['6:30', '12:30'] }
        ];

        // Combinar datos - Mirage Navio primero (destacado)
        const bossData = [...mirageNavioData, ...otherBossData];

        let currentTimezone = -3;
        let showDefeated = false;
        let defeatedBosses = new Set();
        let currentLanguage = 'es';

        document.getElementById('timezone').addEventListener('change', (e) => {
            currentTimezone = parseInt(e.target.value);
            renderTable();
        });

        document.getElementById('language').addEventListener('change', (e) => {
            currentLanguage = e.target.value;
            renderTable();
        });

        document.getElementById('toggleDefeated').addEventListener('click', (e) => {
            showDefeated = !showDefeated;
            e.target.classList.toggle('active', showDefeated);
            renderTable();
        });

        document.getElementById('exportPdf').addEventListener('click', exportToPDF);
        document.getElementById('exportImage').addEventListener('click', exportToImage);
        document.querySelector('.close-modal').addEventListener('click', closeModal);
        document.getElementById('setAlarmBtn').addEventListener('click', setAlarm);

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            bossData.forEach((boss, index) => {
                const isDefeated = defeatedBosses.has(`${boss.world}-${boss.boss}`);
                if (!showDefeated && isDefeated) return;

                const row = document.createElement('tr');
                const isMirageNavio = boss.boss === 'Mirage de Navio';
                
                row.className = isDefeated ? 'defeated' : '';
                if (isMirageNavio) row.classList.add('mirage-main');

                const times = boss.times.map(time => {
                    if (time.includes('Mobs')) return time;
                    return calculateTimezone(time);
                }).join(' / ');

                const hasAlarm = localStorage.getItem(`alarm-${boss.world}-${boss.boss}`) === 'true';
                const bossKey = `${boss.world}-${boss.boss}`;

                row.innerHTML = `
                    <td><input type="checkbox" ${isDefeated ? 'checked' : ''} onchange="toggleDefeated('${bossKey}')"></td>
                    <td><strong>${boss.world}</strong></td>
                    <td>${boss.level}</td>
                    <td>${boss.location}</td>
                    <td>${boss.boss}</td>
                    <td>${times}</td>
                    <td>
                        <div class="row-actions">
                            <button class="btn-small ${hasAlarm ? 'set' : ''}" onclick="openAlarmModal('${bossKey}', '${boss.boss}')">
                                ${hasAlarm ? '✓ Alarma' : '🔔 Alarma'}
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function calculateTimezone(time) {
            if (time.includes(':')) {
                const [hours, minutes] = time.split(':').map(Number);
                let newHours = hours + currentTimezone + 3;
                
                if (newHours >= 24) newHours -= 24;
                if (newHours < 0) newHours += 24;
                
                return `${String(newHours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            }
            return time;
        }

        function toggleDefeated(bossKey) {
            if (defeatedBosses.has(bossKey)) {
                defeatedBosses.delete(bossKey);
            } else {
                defeatedBosses.add(bossKey);
            }
            renderTable();
        }

        function openAlarmModal(bossKey, boss) {
            document.getElementById('alarmBossName').textContent = `${bossKey} - ${boss}`;
            document.getElementById('alarmModal').classList.add('active');
            document.getElementById('alarmModal').dataset.bossKey = bossKey;
        }

        function closeModal() {
            document.getElementById('alarmModal').classList.remove('active');
        }

        function setAlarm() {
            const bossKey = document.getElementById('alarmModal').dataset.bossKey;
            localStorage.setItem(`alarm-${bossKey}`, 'true');
            closeModal();
            renderTable();
            alert('¡Alarma configurada!');
        }

        async function exportToPDF() {
            const element = document.querySelector('.calendar-section');
            const table = document.getElementById('calendarTable').cloneNode(true);
            const container = document.createElement('div');
            
            const logo = document.querySelector('.logo-img');
            const title = document.querySelector('.title');
            const subtitle = document.querySelector('.subtitle');
            
            container.innerHTML = `
                <div style="text-align: center; margin-bottom: 20px;">
                    <h1 style="color: #ff48a0; font-size: 24px; margin: 10px 0;">${title.textContent}</h1>
                    <p style="color: #ff48a0; font-size: 16px;">${subtitle.textContent}</p>
                </div>
            `;
            
            container.appendChild(table);

            const options = {
                margin: 10,
                filename: 'mirage-calendario.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'landscape', unit: 'mm', format: 'a4' }
            };

            html2pdf().set(options).from(container).save();
            alert('PDF descargado correctamente');
        }

        async function exportToImage() {
            const element = document.querySelector('.calendar-section');
            const canvas = await html2canvas(element, {
                backgroundColor: '#050810',
                scale: 2,
                useCORS: true
            });

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'mirage-calendario.png';
            link.click();
            alert('Imagen descargada correctamente');
        }

        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('alarmModal')) {
                closeModal();
            }
        });

        // Crear primer lote de spam
        createSpam();

        renderTable();
    </script>
</body>
</html>
